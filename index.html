
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA — Deine Welt. Ein Link.</title>
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #050505; color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap { width: min(92%, 600px); margin: auto; padding: 32px 0 60px; }
    header { text-align: center; padding: 28px 0 35px; }
    .logo {
      display: inline-grid; place-items: center; width: 62px; height: 62px;
      border: 2px solid white; font-size: 32px; font-weight: 900;
      transform: rotate(45deg); margin-bottom: 20px;
    }
    .logo span { transform: rotate(-45deg); }
    h1 { letter-spacing: 8px; font-size: 29px; margin: 8px 0; }
    .tagline { color: #aaa; font-size: 13px; letter-spacing: 2px; }
    .panel {
      border: 1px solid #303030; border-radius: 18px;
      background: #0d0d0d; padding: 22px; margin-bottom: 18px;
    }
    h2 { font-size: 18px; margin: 0 0 16px; }
    input, button {
      width: 100%; padding: 14px; margin-top: 10px;
      border-radius: 10px; font-size: 15px;
    }
    input { background: #050505; border: 1px solid #393939; color: white; }
    button { border: 1px solid white; cursor: pointer; font-weight: 700; }
    .primary { background: white; color: black; }
    .secondary { background: transparent; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    .muted { color: #aaa; font-size: 13px; line-height: 1.5; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    .link { display: block; padding: 15px; margin-top: 10px; border: 1px solid #444;
      border-radius: 10px; color: white; text-decoration: none; text-align: center; }
    .hidden { display: none; }
    footer { text-align: center; color: #777; font-size: 12px; padding-top: 15px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo"><span>N</span></div>
      <h1>NEXORA</h1>
      <p class="tagline">DEINE WELT. EIN LINK.</p>
    </header>

    <section class="panel" id="authPanel">
      <h2>Dein Account</h2>
      <input id="email" type="email" autocomplete="email" placeholder="E-Mail-Adresse">
      <input id="password" type="password" autocomplete="current-password"
        placeholder="Passwort (mindestens 6 Zeichen)">
      <button class="primary" id="signup">Account erstellen</button>
      <button class="secondary" id="login">Anmelden</button>
      <p class="muted">Falls du deine E-Mail bestätigen musst, öffne die Nachricht von Supabase und bestätige deine Adresse.</p>
    </section>

    <section class="panel hidden" id="profilePanel">
      <h2>Dein Profil</h2>
      <p class="muted" id="signedInAs"></p>
      <input id="displayName" maxlength="60" placeholder="Dein Name oder Profilname">
      <input id="bio" maxlength="160" placeholder="Kurze Beschreibung">
      <button class="primary" id="saveProfile">Profil speichern</button>
      <h2 style="margin-top:26px">Deine Links</h2>
      <input id="linkTitle" maxlength="60" placeholder="Link-Titel">
      <input id="linkUrl" type="url" placeholder="https://example.com">
      <button class="secondary" id="addLink">Link hinzufügen</button>
      <div id="myLinks"></div>
      <button class="secondary" id="logout">Abmelden</button>
    </section>

    <section class="panel hidden" id="publicPanel">
      <h2 id="publicName">NEXORA</h2>
      <p class="muted" id="publicBio"></p>
      <div id="publicLinks"></div>
    </section>

    <p class="muted" id="status" role="status" aria-live="polite"></p>
    <footer>NEXORA © 2026</footer>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://owdcfbdiqwuwfmgvrdec.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_j-u3qWjjb4d0mTIWTSsBeQ_cBOkRfLj';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = id => document.getElementById(id);
    let currentUser = null;
    let links = [];

    function status(message) { $('status').textContent = message; }
    function show(id, visible) { $(id).classList.toggle('hidden', !visible); }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
      } catch { return null; }
    }

    async function loadProfile() {
      const { data: { user }, error } = await supabase.auth.getUser();
      if (error) throw error;
      currentUser = user;
      show('authPanel', !user);
      show('profilePanel', !!user);
      if (!user) return;

      $('signedInAs').textContent = 'Angemeldet als ' + user.email;
      const { data: profile, error: profileError } = await supabase
        .from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (profileError) throw profileError;

      $('displayName').value = profile?.display_name || '';
      $('bio').value = profile?.bio || '';

      const { data, error: linksError } = await supabase
        .from('links').select('*').eq('user_id', user.id).order('id');
      if (linksError) throw linksError;
      links = data || [];
      renderLinks();
    }

    function renderLinks() {
      const container = $('myLinks');
      container.replaceChildren();
      links.forEach(link => {
        const item = document.createElement('div');
        const anchor = document.createElement('a');
        const url = safeUrl(link.url);
        anchor.className = 'link';
        anchor.textContent = link.title || link.url;
        if (url) { anchor.href = url; anchor.target = '_blank'; anchor.rel = 'noopener noreferrer'; }
        item.append(anchor);

        const remove = document.createElement('button');
        remove.className = 'secondary';
        remove.textContent = 'Link löschen';
        remove.addEventListener('click', async () => {
          const { error } = await supabase.from('links').delete().eq('id', link.id);
          if (error) return status('Fehler: ' + error.message);
          links = links.filter(x => x.id !== link.id);
          renderLinks();
          status('Link gelöscht.');
        });
        item.append(remove);
        container.append(item);
      });
    }

    $('signup').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || password.length < 6) return status('Gib eine gültige E-Mail und ein Passwort mit mindestens 6 Zeichen ein.');
      $('signup').disabled = true;
      status('Account wird erstellt …');
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          await loadProfile();
          status('Account erstellt und angemeldet.');
        } else {
          status('Account erstellt. Bitte bestätige deine E-Mail, falls du dazu aufgefordert wirst. Danach kannst du dich anmelden.');
        }
      } catch (e) { status('Fehler: ' + e.message); }
      finally { $('signup').disabled = false; }
    });

    $('login').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return status('Bitte E-Mail und Passwort eingeben.');
      $('login').disabled = true;
      status('Anmeldung läuft …');
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await loadProfile();
        status('Du bist angemeldet.');
      } catch (e) { status('Anmeldung fehlgeschlagen: ' + e.message); }
      finally { $('login').disabled = false; }
    });

    $('saveProfile').addEventListener('click', async () => {
      if (!currentUser) return;
      const display_name = $('displayName').value.trim();
      const bio = $('bio').value.trim();
      status('Profil wird gespeichert …');
      const { error } = await supabase.from('profiles').upsert({
        id: currentUser.id, display_name, bio
      });
      if (error) return status('Speichern fehlgeschlagen: ' + error.message);
      status('Profil gespeichert.');
    });

    $('addLink').addEventListener('click', async () => {
      if (!currentUser) return;
      const title = $('linkTitle').value.trim();
      const url = safeUrl($('linkUrl').value.trim());
      if (!title || !url) return status('Bitte einen Titel und eine gültige URL mit https:// eingeben.');
      const { data, error } = await supabase.from('links').insert({
        user_id: currentUser.id, title, url
      }).select().single();
      if (error) return status('Link konnte nicht gespeichert werden: ' + error.message);
      links.push(data);
      renderLinks();
      $('linkTitle').value = '';
      $('linkUrl').value = '';
      status('Link hinzugefügt.');
    });

    $('logout').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) return status('Abmelden fehlgeschlagen: ' + error.message);
      currentUser = null;
      show('profilePanel', false);
      show('authPanel', true);
      status('Du wurdest abgemeldet.');
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
    });

    try { await loadProfile(); }
    catch (e) { status('Startfehler: ' + e.message); }
  </script>
</body>
</html>
