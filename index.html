
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA</title>
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 850;
      letter-spacing: 7px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .panel {
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 25px 20px;
      background: #080808;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    button, input {
      font: inherit;
      border-radius: 10px;
    }

    .tab {
      flex: 1;
      border: 1px solid #333;
      padding: 12px 6px;
      color: #aaa;
      background: #111;
      cursor: pointer;
    }

    .tab.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      outline: none;
    }

    input:focus {
      border-color: #aaa;
    }

    .main-button {
      width: 100%;
      border: none;
      padding: 14px;
      background: #fff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #message {
      color: #ccc;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .footer {
      color: #666;
      font-size: 12px;
      margin-top: 22px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">NEXORA</div>
    <p class="subtitle">Deine Links. Dein Profil. Deine Welt.</p>

    <section class="panel">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          Anmelden
        </button>
        <button class="tab" id="signupTab" type="button">
          Registrieren
        </button>
      </div>

      <form id="authForm">
        <input
          id="email"
          type="email"
          placeholder="E-Mail-Adresse"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Passwort (mind. 6 Zeichen)"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button class="main-button" id="submitButton" type="submit">
          Anmelden
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <p class="footer">NEXORA © 2026 · Einfach. Persönlich. Du.</p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://owdcfbdiqwuwfmgvrdec.supabase.co';

    // Hier deinen Supabase Publishable Key einsetzen:
    const SUPABASE_KEY = 'HIER_DEIN_PUBLISHABLE_KEY';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.querySelector('#authForm');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const submitButton = document.querySelector('#submitButton');
    const message = document.querySelector('#message');
    const loginTab = document.querySelector('#loginTab');
    const signupTab = document.querySelector('#signupTab');

    let mode = 'login';

    function setMode(newMode) {
      mode = newMode;

      const isLogin = mode === 'login';

      loginTab.classList.toggle('active', isLogin);
      signupTab.classList.toggle('active', !isLogin);

      submitButton.textContent = isLogin
        ? 'Anmelden'
        : 'Konto erstellen';

      passwordInput.autocomplete = isLogin
        ? 'current-password'
        : 'new-password';

      message.textContent = '';
    }

    loginTab.addEventListener('click', () => setMode('login'));
    signupTab.addEventListener('click', () => setMode('signup'));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (
        SUPABASE_KEY === 'HIER_DEIN_PUBLISHABLE_KEY' ||
        !SUPABASE_KEY.startsWith('sb_publishable_')
      ) {
        message.textContent =
          'Bitte trage zuerst deinen Supabase Publishable Key im Code ein.';
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitButton.disabled = true;
      message.textContent = 'Einen Moment …';

      try {
        if (mode === 'signup') {
          const { data, error } = await supabase.auth.signUp({
            email,
            password
          });

          if (error) throw error;

          message.textContent = data.session
            ? 'Konto erstellt! Du bist angemeldet.'
            : 'Registrierung gestartet. Prüfe deine E-Mails, um dein Konto zu bestätigen.';
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          message.textContent = 'Erfolgreich angemeldet!';

          // Hier können wir später dein NEXORA-Profil öffnen.
        }
      } catch (error) {
        message.textContent = error.message ||
          'Das hat nicht funktioniert. Bitte versuche es erneut.';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
